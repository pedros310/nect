<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/lucide@latest"></script>
        <title>nect</title>
        
        <link href='https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap' rel='stylesheet'>

        <link rel="stylesheet" href="./styles/header.css">
        <link rel="stylesheet" href="./styles/posts.css">
        <link rel="stylesheet" href="./styles/general.css">
        <link rel="stylesheet" href="./styles/sidebar.css">
        <link rel="icon" type="image/png" href="styles/fav.png">
    </head>
    <body>
        
        <div class="header">
            <div class="logo">
                <img class="nect-logo" src="styles/nect-logo.png">
            </div>

            <div class = "search-section">

                <input class="search-bar"
                type="text" placeholder="Search">
                
            </div>

            

            <div class="accounty">
                <img class="avatar-profile" src="styles/default-avatar.jpg">
                <a class="us", href="hoho">chyvak</a>
            </div>
        </div>

        
        <div class="sidebar">

            <button class="button">
                <img class="icon" src="styles/main.svg">
                Home
            </button>

            <button class="button">
                <img class="icon" src="styles/profile.svg">
                My profile
            </button>

            <button class="button">
                <img class="icon" src="styles/friends.svg">
                Friends
            </button>

            <button class="button">
                <img class="icon" src="styles/chats.svg">
                Chats
            </button>

            <button class="button">
                Button
            </button>

            <button class="button">
                Button
            </button>

            <button class="button-coffee">
                <img class="icon" src="styles/coffee.svg">
                buy me a coffee
            </button>
        </div>

        <div class="feed">
            <div class="post", style="
                display: flex;
                flex-direction: column;
                align-items: start;
                ">
                    <div class="post-main" style="display: flex; align-items: start;">
                        <div class="post-avatar">
                            <img class="avatar" src="styles/default-avatar.jpg">

                        </div>
                        
                        <div class="post-content">
                            <p class="name">{{nickname}} <span class="username">{{username}}</span> <span class="post-date">{{post_date}}</span></p>
                            <p class = "post-text">{{post_content}}</p>
                            
                        </div>
                    </div>
                    

                    <div class="buttons-bar">
                            <button class="like">
                                ❤ {{quantity}}
                            </button>

                            <button class="comment">
                                comment
                            </button>
                    </div>
            </div>  
            
            
        </div>
        

        <footer class="footer" style='margin-top: 50px; padding: 20px; text-align: center; color: #777; font-size: 0.8em;'>
            <p>© 2026 /nect/ — Социальная сеть</p>
            <p style='font-style: italic;'>Пользователи несут ответственность за контент.</p>
        </footer>

        <script>lucide.createIcons();</script>
    </body>

    
</html>
